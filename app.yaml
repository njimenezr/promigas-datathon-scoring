# Databricks Apps — configuración de la app de scoring (Streamlit).
# El runtime inyecta STREAMLIT_SERVER_PORT y STREAMLIT_SERVER_ADDRESS=0.0.0.0,
# por eso NO se fija el puerto en el command.
command: ["streamlit", "run", "app.py"]

env:
  # ID del SQL Warehouse como valor directo (más robusto que valueFrom, que
  # solo resuelve si el resource ya está registrado al desplegar).
  - name: DBX_WAREHOUSE_ID
    value: "c6d413e83558a43d"
  # Tabla Delta compartida donde se guardan las respuestas (catalogo.esquema.tabla).
  - name: DBX_TABLA
    value: "serverless_demo_nj_catalog.promigas_datathon.app_respuestas"
  # Correos de organizadores (coma-separados) que ven la pestaña de revisión.
  - name: ORGANIZADORES
    value: "nicolas.jimenez@databricks.com"
  - name: STREAMLIT_GATHER_USAGE_STATS
    value: "false"

# El resource le otorga CAN_USE al service principal de la app sobre el warehouse.
# (El ID de arriba debe ser el mismo warehouse.)
resources:
  - name: sql-warehouse
    description: "SQL Warehouse para leer/escribir las respuestas del datathon"
    sql_warehouse:
      id: "c6d413e83558a43d"
      permission: CAN_USE
